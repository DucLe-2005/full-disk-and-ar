name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: API tests
            target: test-api
          - name: Solar events tests
            target: test-solar-events
          - name: Web tests
            target: test-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Show Docker versions
        run: |
          docker version
          docker compose version

      - name: Run ${{ matrix.name }}
        run: make ${{ matrix.target }}

      - name: Show Compose diagnostics after failure
        if: failure()
        run: docker compose -f docker-compose.test.yml ps --all
