services:
  api:
    volumes:
      - ./app:/app/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      target: deps
    environment:
      NODE_ENV: development
    volumes:
      - ./web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    command: npm run dev -- --hostname 0.0.0.0

  worker:
    volumes:
      - ./app:/app/app
      - ./prediction:/app/prediction

  solar-events-api:
    volumes:
      - ./solar-events-service:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  web_node_modules:
  web_next:
